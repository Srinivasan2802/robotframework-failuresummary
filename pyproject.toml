[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "robotframework-failuresummary"
version = "2.0.0"
description = "A standard Robot Framework listener that mutes background engine noise and generates an interactive, deep-linking failure summary report."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Srinivasan A", email = "sriniagt.cse@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Framework :: Robot Framework",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "robotframework>=5.0",
    "urllib3"
]
[project.urls]
Homepage = "https://github.com/Srinivasan2802/robotframework-failuresummary"
[project.scripts]
rf-failure-summary = "RobotFailureSummary.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/RobotFailureSummary"]
[tool.hatch.build.targets.wheel.shared-data]
"src/RobotFailureSummary/templates" = "RobotFailureSummary/templates"
"src/RobotFailureSummary/js" = "RobotFailureSummary/js"